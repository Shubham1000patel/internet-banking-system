<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Transaction Management</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-page {
            max-width: 1250px;
            margin: 35px auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .admin-header h1 {
            margin: 0;
            color: #14213d;
        }

        .account-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .account-controls input,
        .account-controls select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            min-width: 170px;
        }

        .table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .transaction-table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
        }

        .transaction-table th,
        .transaction-table td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .transaction-table th {
            background: #14213d;
            color: white;
        }

        .transaction-table tbody tr:hover {
            background: #f8fafc;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
        }

        .status-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-other {
            background: #e2e8f0;
            color: #334155;
        }

        .transaction-message {
            margin: 15px 0;
            font-weight: 500;
        }

        .warning-text {
            color: #b45309;
            font-size: 12px;
        }

        .back-link {
            color: #1d4ed8;
            text-decoration: none;
            margin-right: 12px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="admin-page">
        <header class="admin-header">
            <div>
                <h1>Transaction Management</h1>
                <p>View and search banking transactions.</p>
            </div>

            <div>
                <a class="back-link" href="admin-dashboard.html">
                    ← Dashboard
                </a>

                <button type="button" id="refreshTransactions">
                    Refresh
                </button>

                <button type="button" id="adminLogoutButton">
                    Logout
                </button>
            </div>
        </header>

        <div class="account-controls">
            <input
                type="search"
                id="transactionSearch"
                placeholder="Search transaction or account"
                aria-label="Search transactions"
            >

            <select id="transactionTypeFilter" aria-label="Filter transaction type">
                <option value="">All transaction types</option>
                <option value="DEPOSIT">Deposit</option>
                <option value="WITHDRAWAL">Withdrawal</option>
                <option value="TRANSFER">Transfer</option>
            </select>

            <select id="transactionStatusFilter" aria-label="Filter transaction status">
                <option value="">All statuses</option>
                <option value="PENDING">Pending</option>
                <option value="SUCCESS">Success</option>
                <option value="SUCCESSFUL">Successful</option>
                <option value="COMPLETED">Completed</option>
                <option value="FAILED">Failed</option>
                <option value="REJECTED">Rejected</option>
                <option value="CANCELLED">Cancelled</option>
            </select>
        </div>

        <p id="transactionMessage" class="transaction-message" role="status">
            Loading transactions...
        </p>

        <p>
            Transactions displayed:
            <strong id="transactionCount">0</strong>
        </p>

        <div class="table-wrapper">
            <table class="transaction-table">
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>From Account</th>
                        <th>To Account</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Description</th>
                        <th>Transaction Date</th>
                    </tr>
                </thead>

                <tbody id="transactionsTableBody">
                    <tr>
                        <td colspan="8">Loading transactions...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/admin-transactions.js"></script>
</body>
</html>
